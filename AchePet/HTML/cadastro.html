<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&family=Merriweather:wght@400;700&family=Open+Sans:wght@400;600;700&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <title>Cadastro | AchePet 🐾</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->

    <header class="site-header">

        <div class="header-container">

            <a href="tela-inicial.html" class="logo">
                <img src="Media/Logo-imagem.png" alt="AchePet">
            </a>

            <nav class="main-nav">

                <a href="tela-inicial.html">INÍCIO</a>

                <a href="login.html">LOGIN</a>

                <div class="nav-dropdown">

                    <a href="#" class="nav-dropdown-link">MURAL</a>

                    <div class="nav-dropdown-menu">

                        <a href="mural-procurados.html" class="menu-procurados">
                            Animais Procurados
                        </a>

                        <a href="mural-encontrados.html" class="menu-encontrados">
                            Animais Encontrados
                        </a>

                    </div>

                </div>

                <a href="quem-somos.html">QUEM SOMOS?</a>

            </nav>

            <button class="theme-toggle" id="themeToggle" aria-label="Alternar tema">
                <span></span>
            </button>

        </div>

    </header>


    <!-- ÁREA DO CADASTRO -->

    <main>

        <section class="cadastro-section">

            <div class="cadastro-container">

                <div class="cadastro-title">
                    <h1>Crie sua conta</h1>
                    <p>Encontre, ajude e faça parte do AchePet.</p>
                </div>

                <div class="cadastro-card">

                    <div class="cadastro-fields">

                        <div class="cadastro-field">
                            <label for="nome">Nome completo</label>
                            <input type="text" id="nome" placeholder="Digite seu nome completo">
                        </div>

                        <div class="cadastro-field">
                            <label for="email">E-mail</label>
                            <input type="email" id="email" placeholder="Digite seu e-mail">
                        </div>

                        <div class="cadastro-field">
                            <label for="cpf">CPF</label>
                            <input type="text" id="cpf" placeholder="Digite seu CPF">
                        </div>

                        <div class="cadastro-field">
                            <label for="cidade">Cidade</label>
                            <input type="text" id="cidade" placeholder="Digite sua cidade">
                        </div>

                        <div class="cadastro-field">
                            <label for="senha">Senha</label>
                            <input type="password" id="senha" placeholder="Digite sua senha">
                        </div>

                        <div class="cadastro-field">
                            <label for="confirmar-senha">Confirmar senha</label>
                            <input type="password" id="confirmar-senha" placeholder="Digite sua senha novamente">
                        </div>

                    </div>

                    <a href="registro.html" class="cadastro-button">
                        REGISTRAR-SE
                    </a>

                </div>

            </div>

        </section>


        <!-- FAIXA ROSA -->

        <section class="cadastro-pink-section">
        </section>

    </main>


    <!-- FOOTER -->

    <footer class="site-footer">

        <div class="footer-content">

            <img class="footer-logo" src="Media/Logo-com-título-remove.png" alt="AchePet">

            <nav class="footer-links">

                <a href="#">
                    <img src="icon-contato.png"> Contato
                </a>

                <a href="tela-inicial.html#quem-somos">
                    <img src="icon-quemsomos.png"> Quem somos?
                </a>

                <a href="tela-inicial.html#mural">
                    <img src="icon-mural.png"> Mural de Pets
                </a>

                <a href="login.html">
                    <img src="icon-entrar.png"> Entrar
                </a>

            </nav>

        </div>


        <div class="footer-bottom">

            <p>© 2026 Ache meu pet</p>

            <div class="footer-divider"></div>

            <p class="footer-message">
                <span>♡</span>
                Juntos por eles
            </p>

        </div>

    </footer>

</body>

</html>
