<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&family=Merriweather:wght@400;700&family=Open+Sans:wght@400;600;700&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">

    <title>Mural Animais Procurados | AchePet 🐾</title>

    <script src="tema.js"></script>
    <link rel="stylesheet" href="style.css">  
</head>

<body class="pagina-procurados" data-page="mural-perdidos">

    <header class="site-header">
        <div class="header-container">
            <a href="tela-inicial.html" class="logo">
                <img src="Media/Logo-imagem.png" alt="AchePet">
                <span>
                    <span class="logo-ache">Ache</span><span class="logo-pet">Pet</span>
                </span>
            </a>

            <nav class="main-nav">
                <a href="tela-inicial.html">INÍCIO</a>

                <a href="login.html">LOGIN</a>

                <a href="form1.html">CADASTRAR ANIMAL</a>

                <div class="nav-dropdown">
                    <a href="#" class="nav-dropdown-link active">MURAL</a>

                    <div class="nav-dropdown-menu">
                        <a href="mural-encontrados.html" class="menu-encontrados">
                            Animais Encontrados
                        </a>
                    </div>
                </div>

                <a href="quem-somos.html">QUEM SOMOS</a>
            </nav>

            <button class="theme-toggle" id="themeToggle" aria-label="Alternar tema">
                <span></span>
            </button>
        </div>
    </header>

    <!-- BARRA DE BUSCA -->
    <section class="hero">

        <div class="hero-content mural-procurados-content">
            <div class="hero-texto">
                <h1>Animais Perdidos</h1><img src="Media/coracao-rosa.png" id="coracao-encontrados">
                <p>Ajude a encontrar os pets que estão desaparecidos na sua região.</p>

            </div>

            

            <div class="search-box">
                <div class="search-input">
                    <span class="search-icon">⌖</span>
                    <input type="text" id="cidadeBusca" placeholder="busca por cidade" autocomplete="off">
                </div>

                <div class="search-buttons">
                    <button type="button" class="btn-lost" id="btnFiltros">FILTROS</button>
                    <button type="button" class="btn-found" id="btnBuscar">BUSCAR</button>
                </div>

            </div>

            <img src="media/Polaroid-Rosa (1).png" id="cachorro">
        </div>
    </section>


    <!-- FILTROS -->
    <section class="filtros-panel" id="filtrosPanel" hidden>
        <div class="filtros-grid">

            <fieldset class="filtro-grupo">
                <legend>Espécie</legend>
                <label><input type="radio" name="especie" value="Cachorro"> Cachorro</label>
                <label><input type="radio" name="especie" value="Gato"> Gato</label>
                <label><input type="radio" name="especie" value="Ave"> Ave</label>
                <label><input type="radio" name="especie" value="Outros"> Outros</label>
            </fieldset>

            <fieldset class="filtro-grupo">
                <legend>Sexo</legend>
                <label><input type="radio" name="sexo" value="macho"> Macho</label>
                <label><input type="radio" name="sexo" value="femea"> Fêmea</label>
                <label><input type="radio" name="sexo" value="nao-identificado"> Não identificado</label>
            </fieldset>

            <fieldset class="filtro-grupo">
                <legend>Porte</legend>
                <label><input type="radio" name="porte" value="Pequeno"> Pequeno</label>
                <label><input type="radio" name="porte" value="Médio"> Médio</label>
                <label><input type="radio" name="porte" value="Grande"> Grande</label>
            </fieldset>

            <fieldset class="filtro-grupo">
                <legend>Cor</legend>
                <input type="text" id="filtroCor" name="cor" placeholder="Ex.: preto, caramelo" maxlength="30">
            </fieldset>

        </div>
        <div class="filtros-acoes">
            <button type="button" class="filtro-btn filtro-limpar" id="btnLimparFiltros">Limpar</button>
            <button type="button" class="filtro-btn filtro-aplicar" id="btnAplicarFiltros">Aplicar filtros</button>
        </div>
    </section>

    <!-- MURAL DE ANIMAIS PERDIDOS -->
    <section class="pets-section lost-section">
        <div class="section-container">

            <div class="pets-grid" id="petsGrid" data-status="perdido" data-limite="12"></div>

            <div class="ver-mais-wrapper" id="carregarMaisWrapper" hidden>
                <button type="button" class="btn-ver-mais" id="btnCarregarMais">CARREGAR MAIS</button>
            </div>
        </div>

    </section>

    <footer class="site-footer">
        <div class="footer-content">

            <img class="footer-logo" src="Media/Logo-com-título-remove.png" alt="AchePet">

            <nav class="footer-links">

                <a href="#">
                    <img src="Media/icon-contato.png"> Contato
                </a>

                <a href="tela-inicial.html#quem-somos">
                    <img src="Media/icon-quemsomos.png"> Quem somos?
                </a>

                <a href="tela-inicial.html#mural">
                    <img src="Media/icon-mural.png"> Mural de Pets
                </a>

                <a href="login.html">
                    <img src="Media/icon-entrar.png"> Entrar
                </a>

            </nav>

        </div>

        <div class="footer-bottom">
            <p>© 2026 AchePet</p>
            <div class="footer-divider"></div>
            <p class="footer-message"><span>♡</span> Juntos por eles</p>
        </div>
    </footer>

    <script src="script.js"></script>

</body>

</html>
