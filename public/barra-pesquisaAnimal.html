<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&family=Merriweather:wght@400;700&family=Open+Sans:wght@400;600;700&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<section class="area-busca">

    <div class="barra-pesquisa">
        <span> 🔎 </span>
        <input type="text" placeholder="buscar por cidade">
    </div>

    <div class="filtros">

        <div class="linha-filtros">
            <button>PERDI</button>
            <button>ENCONTREI</button>
        </div>

<div class="filtro-especie">

    <h4>Espécie</h4>
        <label>
            <input type="radio" name="especie">
            Cachorro
        </label>

        <label>
            <input type="radio" name="especie">
            Gato
        </label>

        <label>
            <input type="radio" name="especie">
            Outros
        </label>
</div>

<div class="filtro-genero">
    <h4>Gênero</h4>
        <label>
            <input type="radio" name="genero">
            Macho
        </label>

        <label>
            <input type="radio" name="genero">
            Fêmea
        </label>
</div>

<div class="filtro-pelo">
    <h4>Pelagem</h4>
        <label>
            <input type="radio" name="pelo">
            Curto
        </label>

        <label>
            <input type="radio" name="pelo">
            Médio
        </label>

        <label>
            <input type="radio" name="pelo">
            Longo
        </label>
</div>

<div class="filtro-porte">
    <h4>Porte</h4>
        <label>
            <input type="radio" name="porte">
            Pequeno
        </label>

        <label>
            <input type="radio" name="porte">
            Médio
        </label>

        <label>
            <input type="radio" name="porte">
            Grande
        </label>
</div>

<div class="filtro-idade">
    <h4>Idade</h4>
        <label>
            <input type="radio" name="idade">
            Filhote
        </label>

        <label>
            <input type="radio" name="idade">
            Adulto
        </label>

        <label>
            <input type="radio" name="idade">
            Senior
        </label>
</div>

<div class="filtro-cor">
    <h4>Cor</h4>
        <label>
            <input type="radio" name="cor">
            Branco
        </label>

        <label>
            <input type="radio" name="cor">
            Preto
        </label>

        <label>
            <input type="radio" name="cor">
            Outro
        </label>
</div>
