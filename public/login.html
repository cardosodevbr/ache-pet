<script>

        async function logar() {
            // 2. Captura os valores digitados nos inputs 
            const email = document.getElementById('loginEmail').value.trim();
            const senha = document.getElementById('loginSenha').value;

            // Evita rodar se estiver vazio
            if (!email || !senha) return alert("⚠️ Preencha e-mail e senha!");

            // 3. Envia o comando de Autenticação para o Supabase
            const { error } = await clienteSupabase.auth.signInWithPassword({
                email: email,
                password: senha
            });

            // 4. Caminho Feliz: Se NÃO tiver erro, vai para a página logada
            if (!error) {
                // e agora?: pra onde vai?
                window.location.replace('index.html'); 
            } else {
                // Mostra o erro só pra ajudar a turma a ver se erraram a senha
                alert("❌ Erro ao entrar: " + error.message);
            }
        }
    </script>
